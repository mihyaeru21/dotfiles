#:schema https://www.schemastore.org/stylua.json

syntax = 'LuaJIT'
indent_type = 'Spaces'
quote_style = 'AutoPreferSingle'
column_width = 120
line_endings = 'Unix'
indent_width = 2
sort_requires.enabled = true
call_parentheses = 'Always'
collapse_simple_statement = 'Always'
space_after_function_names = 'Never'
